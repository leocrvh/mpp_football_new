<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MPP TV Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="screen">
    <section class="panel mpp-panel">
      <div class="panel-header compact">
        <div>
          <p class="eyebrow">Ligue MPP</p>
          <h1>Classement</h1>
        </div>
        <div class="mpp-note">Connexion à faire directement dans cette fenêtre</div>
      </div>

      <div class="iframe-wrap">
        <iframe
          src="https://mpp.football/leagues/mpp_challenge_UC8MVG4F"
          title="Classement MPP"
          referrerpolicy="no-referrer-when-downgrade">
        </iframe>
      </div>

      <div class="iframe-warning">
        Si MPP bloque l'incrustation, l'affichage peut rester vide.
      </div>
    </section>

    <section class="panel matches-panel">
      <div class="panel-header compact">
        <div>
          <p class="eyebrow">Coupe du monde 2026</p>
          <h2>Matchs & résultats</h2>
        </div>
        <div class="clock">
          <strong id="clockTime">--:--</strong>
          <span id="clockDate">--</span>
        </div>
      </div>

      <div id="matches" class="matches">
        <div class="empty">Chargement des matchs...</div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span id="status">Initialisation...</span>
    <span id="updatedAt">Dernière mise à jour : --</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
